services:
    strichliste:
        build:
            context: .
        # if you use traefik you can remove the ports section
        ports:
            - 8080:8080
        env_file:
            - docker.env
        volumes:
            - ./config/strichliste.yaml:/app/config/strichliste.yaml

        environment:
            APP_ENV: "prod"

    strichliste-db:
        image: mariadb:12.0.2
        restart: always
        env_file:
            - docker.env
        volumes:
            - ./data/mysql:/var/lib/mysql

networks:
    proxy:
        external: true
